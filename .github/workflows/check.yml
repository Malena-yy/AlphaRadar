name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate papers.yaml and README index
        run: |
          pip install pyyaml
          python scripts/build_index.py --check
      - name: Check local Markdown links (no image embeds)
        run: python scripts/check_links.py
