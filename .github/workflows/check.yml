name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry and generated documents
        run: |
          pip install pyyaml
          python scripts/build_index.py --check
      - name: Check Markdown links and section anchors
        run: python scripts/check_links.py
      - name: Check committed whitespace
        run: git show --format= --check -m HEAD
