name: 新论文候选
description: 登记一篇待收录的因子挖掘相关工作
title: "[paper] <简称>"
body:
  - type: input
    id: link
    attributes:
      label: 论文链接
      description: arXiv、会议或 OpenReview 页面
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: 代码仓库
      description: 官方仓库链接；未见官方开源可留空
  - type: input
    id: problems
    attributes:
      label: 针对的问题
      description: P1–P10 中的编号，可填多个；定义见 README“因子挖掘面临的问题”，不确定可留空
  - type: input
    id: routes
    attributes:
      label: 路线
      description: 取值见 taxonomy.yaml 的 routes，可填多个，例如 formulaic、llm-formula、llm-agent；不确定可留空
  - type: textarea
    id: why
    attributes:
      label: 收录理由
      description: 用一两句话说明它与因子挖掘的关系，以及值得关注的机制
    validations:
      required: true
