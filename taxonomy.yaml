# AlphaRadar 分类体系。papers.yaml 中的 problems / routes / tags / status 只能使用这里定义的取值。
# 问题分两级：problems 是论文动机所在、主要贡献针对的问题（至多 3 个），also 是有对应机制但不是主要贡献的问题；路线（routes）表示工作所属的研究板块，标签（tags）记录具体技术手段；都是多标签。
# 问题的说明和跟踪关注点见 README“因子挖掘面临的问题”，各问题的应对机制见 topics/problems.md。
# problems 的 code 是对外编号，已发布的编号不改；tension（核心矛盾）和 stage（所在环节）用于生成 README 问题总表。

problems:
  search-space:
    code: P1
    name: 表达空间巨大，有效因子稀少
    tension: 空间随表达式长度组合爆炸，其中大多不合法、无意义或彼此语义等价
    stage: 表达与搜索
  expressiveness:
    code: P2
    name: 表达能力与可解释性的权衡
    tension: 公式可解释、可审计但表达受限；神经因子和任意代码表达更强，却难以解释和审计
    stage: 表达
  eval-cost:
    code: P3
    name: 评价成本高
    tension: 每个候选都要在全市场长周期面板上求值，评价次数直接决定搜索规模
    stage: 评价
  learning-signal:
    code: P4
    name: 学习信号稀疏、延迟且不可微
    tension: 只有完整因子才有奖励，IC 对生成过程没有梯度，奖励还随因子池变化
    stage: 训练
  overfitting:
    code: P5
    name: 低信噪比下的过拟合
    tension: 收益中可预测成分很小，大规模搜索等于大量多重检验
    stage: 评价可信度
  leakage:
    code: P6
    name: 前视偏差与信息泄漏
    tension: 一处时间对齐错误就能制造虚假的高 IC，且很难从结果上察觉
    stage: 评价可信度
  redundancy:
    code: P7
    name: 因子同质化与冗余
    tension: 搜索集中到少数高分模板，新因子与已有因子高度相关
    stage: 入池
  objective-gap:
    code: P8
    name: 挖掘目标与实际使用脱节
    tension: 单因子高 IC 不等于组合增益，也不等于扣除换手和成本后仍可交易
    stage: 组合与交易
  decay:
    code: P9
    name: 非平稳与因子衰减
    tension: 市场状态在变，因子被拥挤后失效，挖掘需要持续维护
    stage: 持续使用
  reproducibility:
    code: P10
    name: 评估口径不统一、难以复现
    tension: 各工作的股票池、切分、标签、指标和成本假设不同，很多未开源
    stage: 研究方法

routes:
  formulaic:
    name: 公式 / 符号 / 代码因子挖掘
    scope: 以公式、符号表达式、DSL、AST、文法或可执行程序表示的因子生成与搜索，包括遗传规划、AutoML、RL / MCTS / GFlowNet 与代码演化。
  llm-formula:
    name: LLM 驱动的因子生成
    scope: 由大语言模型提出、实现或改写因子表达式；搜索与评价循环可以是传统搜索器，LLM 负责生成与变异。
  llm-agent:
    name: LLM / Agent 研究流程
    scope: 重点在流程编排：研究轨迹、经验记忆、预算调度、多智能体分工与自改进闭环，而不是某种特定的表达式表示。
  neural:
    name: 神经 / 隐式因子
    scope: 深度网络直接输出 alpha 信号或学习因子表示，包括离散隐因子、动态载荷等保留部分可解释结构的做法。
  pool-combination:
    name: 因子池与组合（下游模块）
    scope: 候选因子的准入、去冗余、筛选启停、动态加权与组合构建。它通常与方法路线并用，也用于以池为评价单位的基准。
  benchmark:
    name: 基准与统一评测
    scope: 给出统一数据、切分、指标或执行契约，用来横向比较多个挖掘方法。
  auditing:
    name: 审计、复现与泄漏检查
    scope: 审视证据链本身：结果留存方式、指标口径、前视检查、试验计数与显著性校正，而不是给方法排名。
  data-space:
    name: 数据与表达空间
    scope: 扩展因子的输入数据（高频、订单簿、文本、另类数据）或表达空间本身。
  adjacent:
    name: 可迁移的相邻方法
    scope: 不是因子挖掘本身，但机制可以迁移的方法，例如符号回归、生成流网络、智能体信用分配与多重检验。

status:
  inbox: 已发现、尚未判断是否收录
  triaged: 已确认收录，尚未写速读卡
  card: 已有速读卡
  deep-read: 已有精读

tags:
  # 搜索与训练方法
  - rl                     # 强化学习优化生成策略
  - ppo                    # 近端策略优化
  - reinforce              # REINFORCE 及其基线变体
  - grpo                   # 组相对策略优化，含 DAPO 等变体
  - rft                    # 强化微调：把评价反馈写进模型参数
  - distributional-rl      # 学习回报分布而非期望
  - reward-shaping         # 中间步骤或轨迹级奖励塑形
  - multi-objective        # 多目标或 Pareto 式奖励
  - preference-optimization # 把奖励转成偏好对做训练
  - mcts                   # 蒙特卡洛树搜索
  - gflownet               # 生成流网络及其目标
  - genetic-programming    # 遗传规划
  - evolutionary           # 进化或演化搜索（非严格遗传规划）
  - quality-diversity      # 质量-多样性搜索与存档
  - diffusion              # 离散扩散生成
  - program-search         # 在程序或指令空间搜索
  - code-evolution         # 演化可执行代码
  - dsl                    # 受限领域特定语言表达式
  - grammar                # 以文法定义合法表达式空间
  - symbolic-regression    # 符号回归（相邻方法常用）
  - distillation           # 蒸馏教师信号，含在线策略蒸馏
  - surrogate-model        # 在真实评价前用学到的模型打分或分配预算
  # 表示与模型
  - rpn                    # 逆波兰表示
  - gnn                    # 图神经网络
  - transformer            # Transformer 主干
  - neural-alpha           # 神经网络直接输出因子信号
  - llm                    # 以语言模型生成、实现或评价因子
  - multi-agent            # 多个智能体分工或对抗
  - memory                 # 跨轮次记忆
  - rag                    # 检索增强
  - human-in-the-loop      # 人类想法或审核进入循环
  - multimodal             # 从文本、表格、图像等多种材料抽取线索
  # 因子池、组合与评价
  - pool-reward            # 以加入因子池或组合的边际贡献作奖励
  - dynamic-combination    # 按市场状态动态定池或定权
  - factor-screening       # 对已有因子筛选启停
  - factor-lineage         # 以因子谱系或演化图组织搜索
  - factor-model-joint     # 因子与预测模型联合优化
  - portfolio              # 直接面向组合构建或组合表现
  - alpha-decay            # 以对抗因子衰减为生成目标
  - multiple-testing       # 多重检验与错误发现控制
  - auditing               # 证据审计与可追溯记录
  - benchmark              # 基准或统一评测框架
  - safety                 # 安全沙箱与准入
  # 数据与因子类型
  - formula-library        # 人工公式因子库
  - high-frequency         # 高频或订单簿数据
  - alternative-data       # 文本、新闻、情绪等另类数据
  - risk-factor            # 风险因子而非 alpha 因子
