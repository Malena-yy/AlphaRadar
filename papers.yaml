# AlphaRadar 论文登记表：唯一事实源。README 的生成区块、INDEX.md 和速读卡开头的元数据都由 scripts/build_index.py 据此生成。
# 字段：
#   id            唯一标识，<小写简称>-<首次公开年份>
#   short         常用简称；在 topics/problems.md 中按简称识别论文，不能重复
#   title         论文完整标题
#   summary       中文一句话：做了什么、靠什么机制，约 40 字以内
#   first_public  最早公开版本的年月 YYYY-MM（通常是 arXiv v1 的提交日期）；只知道年份时写 YYYY
#   versions      版本说明，例如 "arXiv v1 2025-09；v3 2026-05"；没有 arXiv 时写论文集等信息
#   venue         会议或期刊，例如 "ICLR 2026"；尚未发表为 null
#   arxiv         arXiv 编号；没有为 null
#   url           论文主链接
#   code          官方仓库链接；未见官方开源为 null
#   code_note     开源补充说明：未开源时写检索结论；有仓库时只写完整性等补充；没有则为 null
#   affiliation   作者单位
#   problems      针对的问题，取 taxonomy.yaml 中 problems 的键，多选；基线或背景工作为 []
#   routes, tags  路线与标签，多选，取值见 taxonomy.yaml
#   status        inbox / triaged / card / deep-read
#   card, deep    速读卡与精读路径
#   added         收录日期
#   checked       最近一次核查版本与发表状态的日期；开源情况的检索日期写在 code_note 中
